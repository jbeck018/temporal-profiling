# golangci-lint configuration
# https://golangci-lint.run/usage/configuration/

run:
  timeout: 5m
  skip-dirs:
    - examples
  skip-files:
    - ".*_test\\.go$"

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
  disable:
    - typecheck  # Handled by go build

linters-settings:
  errcheck:
    check-type-assertions: false
    check-blank: false
  govet:
    check-shadowing: false
  staticcheck:
    checks: ["all", "-SA1019"]  # Ignore deprecation warnings

issues:
  exclude-dirs:
    - examples
    - vendor
    - third_party
  exclude-rules:
    # Exclude some linters from running on tests files
    - path: _test\.go
      linters:
        - errcheck
        - gosec
    # Ignore long lines in generated files
    - path: ".*\\.pb\\.go"
      linters:
        - all
  max-issues-per-linter: 0
  max-same-issues: 0
