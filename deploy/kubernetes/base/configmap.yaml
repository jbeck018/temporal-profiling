apiVersion: v1
kind: ConfigMap
metadata:
  name: temporal-profiler-config
  namespace: temporal-profiler
  labels:
    app.kubernetes.io/name: temporal-profiler
data:
  # Set to "true" to enable Slack alerts
  slack-enabled: "false"

  temporal-profiler.yaml: |
    proxy:
      listen_addr: ":7234"
      upstream_addr: "temporal-frontend.temporal.svc.cluster.local:7233"
      tls:
        enabled: false

    profiler:
      buffer_size: 10000
      batch_size: 100
      flush_interval: "5s"
      worker_count: 2

    sampling:
      enabled: false
      rate: 1.0

    sinks:
      otel:
        enabled: true
        endpoint: "otel-collector.monitoring.svc.cluster.local:4317"
        protocol: "grpc"
        resource_attributes:
          service.name: "temporal-profiler"
          service.namespace: "temporal"
        metrics:
          enabled: true
          export_interval: "10s"
        traces:
          enabled: true

      slack:
        enabled: false
        alerts:
          - name: "workflow_failed"
            condition: "event_type == WORKFLOW_FAILED"
            severity: "error"
          - name: "slow_workflow"
            condition: "workflow_duration > 30s"
            severity: "warning"
        rate_limit:
          max_per_minute: 10
          cooldown: "5m"

    logging:
      level: "info"
      format: "json"

    admin:
      enabled: true
      addr: ":8080"
