# Google Cloud Run service definition for Temporal Profiler
# Deploy with: gcloud run services replace service.yaml

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: temporal-profiler
  labels:
    cloud.googleapis.com/location: us-central1
  annotations:
    run.googleapis.com/launch-stage: BETA
    run.googleapis.com/description: "Temporal.io profiling proxy with OTEL export"
spec:
  template:
    metadata:
      annotations:
        # Scaling configuration
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "10"

        # Performance optimization
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/startup-cpu-boost: "true"

        # VPC configuration for private network access
        run.googleapis.com/vpc-access-connector: "projects/${PROJECT_ID}/locations/${REGION}/connectors/${VPC_CONNECTOR}"
        run.googleapis.com/vpc-access-egress: "private-ranges-only"

    spec:
      containerConcurrency: 100
      timeoutSeconds: 300
      serviceAccountName: temporal-profiler@${PROJECT_ID}.iam.gserviceaccount.com

      containers:
        - name: temporal-profiler
          image: ${REGION}-docker.pkg.dev/${PROJECT_ID}/temporal-profiler/temporal-profiler:latest

          # gRPC requires HTTP/2
          ports:
            - name: h2c
              containerPort: 7234

          env:
            - name: TEMPORAL_PROFILER_PROXY_LISTEN_ADDR
              value: ":7234"
            - name: TEMPORAL_PROFILER_PROXY_UPSTREAM_ADDR
              value: "temporal-server.internal:7233"
            - name: TEMPORAL_PROFILER_SINKS_OTEL_ENABLED
              value: "true"
            - name: TEMPORAL_PROFILER_SINKS_OTEL_ENDPOINT
              value: "otel-collector.internal:4317"
            - name: TEMPORAL_PROFILER_ADMIN_ENABLED
              value: "true"
            - name: TEMPORAL_PROFILER_ADMIN_ADDR
              value: ":8080"
            - name: TEMPORAL_PROFILER_LOGGING_LEVEL
              value: "info"

          # Secrets from Secret Manager
          envFrom:
            - secretRef:
                name: temporal-profiler-secrets

          resources:
            limits:
              cpu: "2"
              memory: 1Gi

          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
            timeoutSeconds: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

  traffic:
    - percent: 100
      latestRevision: true
