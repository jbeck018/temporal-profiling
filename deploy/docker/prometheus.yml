# Prometheus configuration for Temporal Profiler

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Temporal Profiler metrics
  - job_name: 'temporal-profiler'
    static_configs:
      - targets: ['temporal-profiler:8080']
    metrics_path: /metrics
    scrape_interval: 10s

  # OpenTelemetry Collector metrics (from Prometheus exporter)
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']
    scrape_interval: 10s

  # Temporal Server metrics (if available)
  - job_name: 'temporal-server'
    static_configs:
      - targets: ['temporal:8000']
    scrape_interval: 15s
    metrics_path: /metrics

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
