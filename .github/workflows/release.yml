name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

env:
  GO_VERSION: '1.22'

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        uses: metcalfc/changelog-generator@v4.3.1
        with:
          myToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref_name }}
          body: |
            ## Temporal Profiler ${{ github.ref_name }}

            ### Docker Image
            ```bash
            docker pull ghcr.io/${{ github.repository }}:${{ steps.get_version.outputs.version }}
            ```

            ### Helm Chart
            ```bash
            helm repo add temporal-profiler https://${{ github.repository_owner }}.github.io/temporal-profiling
            helm install temporal-profiler temporal-profiler/temporal-profiler --version ${{ steps.get_version.outputs.version }}
            ```

            ### Changelog
            ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}

  build-binaries:
    name: Build Binaries
    needs: release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          output="temporal-profiler-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            output="${output}.exe"
          fi
          go build -ldflags="-s -w -X main.version=${{ needs.release.outputs.version }} -X main.commit=${{ github.sha }}" \
            -o "${output}" ./cmd/temporal-profiler

      - name: Create archive (Unix)
        if: matrix.goos != 'windows'
        run: |
          tar -czvf temporal-profiler-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz \
            temporal-profiler-${{ matrix.goos }}-${{ matrix.goarch }} \
            README.md LICENSE

      - name: Create archive (Windows)
        if: matrix.goos == 'windows'
        run: |
          zip temporal-profiler-${{ matrix.goos }}-${{ matrix.goarch }}.zip \
            temporal-profiler-${{ matrix.goos }}-${{ matrix.goarch }}.exe \
            README.md LICENSE

      - name: Upload Release Asset (Unix)
        if: matrix.goos != 'windows'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.release.outputs.upload_url }}
          asset_path: temporal-profiler-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
          asset_name: temporal-profiler-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
          asset_content_type: application/gzip

      - name: Upload Release Asset (Windows)
        if: matrix.goos == 'windows'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.release.outputs.upload_url }}
          asset_path: temporal-profiler-${{ matrix.goos }}-${{ matrix.goarch }}.zip
          asset_name: temporal-profiler-${{ matrix.goos }}-${{ matrix.goarch }}.zip
          asset_content_type: application/zip

  publish-helm:
    name: Publish Helm Chart
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Update chart version
        run: |
          sed -i "s/^version:.*/version: ${{ needs.release.outputs.version }}/" deploy/helm/temporal-profiler/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${{ needs.release.outputs.version }}\"/" deploy/helm/temporal-profiler/Chart.yaml

      - name: Package Helm chart
        run: |
          helm package deploy/helm/temporal-profiler -d .helm-releases

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Update Helm repo
        run: |
          cp .helm-releases/*.tgz gh-pages/
          cd gh-pages
          helm repo index . --url https://${{ github.repository_owner }}.github.io/temporal-profiling
          git add .
          git commit -m "Release Helm chart ${{ needs.release.outputs.version }}"
          git push
